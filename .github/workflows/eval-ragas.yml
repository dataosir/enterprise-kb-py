name: Eval RAGAS (optional)

on:
  workflow_dispatch:
    inputs:
      chunk_size:
        description: Chunk size for eval
        default: "512"
        required: false

jobs:
  eval-ragas:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    if: ${{ secrets.DEEPSEEK_API_KEY != '' || secrets.OPENAI_API_KEY != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-eval.txt

      - name: Install dependencies
        run: |
          python -m venv .venv
          .venv/bin/pip install -r requirements.txt -r requirements-eval.txt

      - name: Run L3 RAGAS eval
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY || secrets.DEEPSEEK_API_KEY }}
          OPENAI_BASE_URL: https://api.deepseek.com/v1
        run: |
          .venv/bin/python scripts/eval_ragas.py --run --ragas --chunk-size ${{ inputs.chunk_size }}

      - name: Upload L3 report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-ragas-report
          path: data/eval/eval_report.json
