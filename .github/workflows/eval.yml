name: Eval Smoke

on:
  pull_request:
    paths:
      - "app/**"
      - "scripts/**"
      - "sample-docs/**"
      - "requirements.txt"
      - "Makefile"
      - ".github/workflows/eval.yml"
  push:
    branches: [main]
    paths:
      - "app/**"
      - "scripts/**"
      - "sample-docs/**"
      - "requirements.txt"
      - "Makefile"
      - ".github/workflows/eval.yml"
  workflow_dispatch:

jobs:
  eval-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m venv .venv
          .venv/bin/pip install -r requirements.txt

      - name: Run eval smoke (L1 + L2 + baseline)
        run: make eval-smoke

      - name: Upload eval artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-reports
          path: |
            data/eval/chunk_analysis.json
            data/benchmark/benchmark_rag_params.json
            data/benchmark/benchmark_rag_params.csv
