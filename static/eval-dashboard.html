<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RAG 评测看板 · 指标闭环</title>
    <style>
        :root {
            --bg: #0b0f14;
            --surface: #121a24;
            --surface2: #1a2433;
            --border: #2a3a52;
            --text: #e8edf5;
            --muted: #8fa3bf;
            --accent: #3b82f6;
            --l1: #22c55e;
            --l2: #3b82f6;
            --l3: #a855f7;
            --l4: #f59e0b;
            --ops: #64748b;
            --pass: #22c55e;
            --fail: #ef4444;
            --warn: #f59e0b;
            --info: #64748b;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            line-height: 1.5;
        }
        a { color: var(--accent); text-decoration: none; }
        a:hover { text-decoration: underline; }
        header {
            padding: 16px 24px;
            border-bottom: 1px solid var(--border);
            background: var(--surface);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        header h1 { font-size: 18px; font-weight: 600; }
        .header-actions { display: flex; gap: 12px; align-items: center; font-size: 13px; color: var(--muted); }
        .btn {
            background: var(--surface2);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
        }
        .btn:hover { border-color: var(--accent); }
        .btn-primary { background: var(--accent); border-color: var(--accent); color: #fff; }
        main { max-width: 1400px; margin: 0 auto; padding: 24px; }
        .gate-banner {
            padding: 16px 20px;
            border-radius: 10px;
            margin-bottom: 24px;
            border: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
        }
        .gate-banner.pass { background: rgba(34, 197, 94, 0.1); border-color: rgba(34, 197, 94, 0.4); }
        .gate-banner.fail { background: rgba(239, 68, 68, 0.1); border-color: rgba(239, 68, 68, 0.4); }
        .gate-title { font-size: 16px; font-weight: 600; }
        .gate-errors { font-size: 13px; color: var(--muted); margin-top: 4px; }
        .section { margin-bottom: 32px; }
        .section h2 {
            font-size: 15px;
            font-weight: 600;
            margin-bottom: 16px;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        .layer-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 16px;
        }
        .layer-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            overflow: hidden;
        }
        .layer-card.missing { opacity: 0.7; }
        .layer-header {
            padding: 14px 16px;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .layer-badge {
            font-size: 11px;
            font-weight: 700;
            padding: 2px 8px;
            border-radius: 4px;
            color: #000;
        }
        .layer-body { padding: 14px 16px; }
        .metric-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 0;
            border-bottom: 1px solid rgba(42, 58, 82, 0.5);
            font-size: 14px;
        }
        .metric-row:last-child { border-bottom: none; }
        .metric-label { color: var(--muted); }
        .metric-value { font-weight: 600; font-variant-numeric: tabular-nums; }
        .status-dot {
            width: 8px; height: 8px; border-radius: 50%; display: inline-block; margin-right: 6px;
        }
        .status-pass { background: var(--pass); }
        .status-fail { background: var(--fail); }
        .status-info { background: var(--info); }
        .status-skip { background: var(--muted); }
        .status-missing { background: var(--warn); }
        .tool-hint { font-size: 12px; color: var(--muted); margin-top: 10px; }
        .mindmap-wrap {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            overflow: hidden;
        }
        .mindmap-toolbar {
            padding: 12px 16px;
            border-bottom: 1px solid var(--border);
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            align-items: center;
            font-size: 13px;
            color: var(--muted);
        }
        .legend { display: flex; gap: 16px; flex-wrap: wrap; }
        .legend-item { display: flex; align-items: center; gap: 6px; }
        .legend-swatch { width: 12px; height: 12px; border-radius: 3px; }
        #mindmap-svg {
            width: 100%;
            height: 620px;
            display: block;
            cursor: grab;
        }
        #mindmap-svg:active { cursor: grabbing; }
        .graph-node { cursor: pointer; }
        .graph-node circle { stroke-width: 2; transition: r 0.15s; }
        .graph-node:hover circle { filter: brightness(1.2); }
        .graph-node text { font-size: 11px; fill: var(--text); pointer-events: none; }
        .graph-edge { stroke: #3d5270; stroke-width: 1.2; fill: none; opacity: 0.6; }
        .graph-edge.highlight { stroke: var(--accent); opacity: 1; stroke-width: 2; }
        .edge-label { font-size: 9px; fill: var(--muted); }
        .detail-panel {
            margin-top: 12px;
            padding: 12px 16px;
            background: var(--surface2);
            border-radius: 8px;
            font-size: 13px;
            min-height: 48px;
            color: var(--muted);
        }
        .detail-panel strong { color: var(--text); }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
        }
        th, td {
            padding: 10px 12px;
            text-align: left;
            border-bottom: 1px solid var(--border);
        }
        th { color: var(--muted); font-weight: 500; background: var(--surface2); }
        tr:hover td { background: rgba(59, 130, 246, 0.05); }
        .table-wrap {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            overflow: auto;
        }
        .runtime-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
            gap: 12px;
        }
        .runtime-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 14px;
        }
        .runtime-card .label { font-size: 12px; color: var(--muted); }
        .runtime-card .value { font-size: 22px; font-weight: 700; margin-top: 4px; }
        .workflow {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            align-items: center;
            font-size: 13px;
            color: var(--muted);
            padding: 16px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
        }
        .workflow-step {
            background: var(--surface2);
            padding: 6px 12px;
            border-radius: 6px;
            border: 1px solid var(--border);
        }
        .workflow-arrow { color: var(--accent); }
        .loading { text-align: center; padding: 80px; color: var(--muted); }
        @media (max-width: 768px) {
            main { padding: 16px; }
            #mindmap-svg { height: 480px; }
        }
    </style>
</head>
<body>
    <header>
        <h1>RAG 评测看板 · 分层指标闭环</h1>
        <div class="header-actions">
            <span id="updatedAt">加载中...</span>
            <button class="btn" id="refreshBtn">刷新</button>
            <a class="btn" href="/middleware-map.html">🧩 中间件导图</a>
            <a class="btn" href="/">← 返回问答</a>
        </div>
    </header>

    <main id="app">
        <div class="loading">正在加载评测数据...</div>
    </main>

    <script>
        const LAYER_COLORS = { L1: '#22c55e', L2: '#3b82f6', L3: '#a855f7', L4: '#f59e0b', ops: '#64748b' };
        const NODE_COLORS = { knob: '#f59e0b', metric: '#3b82f6', outcome: '#22c55e', gate: '#64748b' };

        let dashboardData = null;
        let graphState = { scale: 1, tx: 0, ty: 0, highlight: null };

        function fmtPct(v) {
            if (v == null) return '—';
            return (v * 100).toFixed(1) + '%';
        }
        function fmtNum(v, digits = 2) {
            if (v == null) return '—';
            return Number(v).toFixed(digits);
        }
        function fmtMs(v) {
            if (v == null) return '—';
            return Math.round(v) + ' ms';
        }
        function statusClass(s) {
            return { pass: 'status-pass', fail: 'status-fail', info: 'status-info', skip: 'status-skip', missing: 'status-missing' }[s] || 'status-info';
        }
        function formatMetricValue(check) {
            if (check.value == null) return '—';
            if (check.unit === 'ratio') return fmtPct(check.value);
            if (check.unit === 'ms') return fmtMs(check.value);
            if (check.unit === 'count') return String(Math.round(check.value));
            return fmtNum(check.value, 3);
        }

        function renderGate(data) {
            const g = data.gate;
            const cls = g.pass ? 'pass' : 'fail';
            const title = g.pass ? '✅ 基线门禁通过 — 可上线参考' : '❌ 基线门禁未通过 — 请回归调参';
            const errors = g.errors.length ? g.errors.join('；') : '全部 L1/L2 指标达到 baseline.json 阈值';
            return `<div class="gate-banner ${cls}">
                <div>
                    <div class="gate-title">${title}</div>
                    <div class="gate-errors">${errors}</div>
                </div>
                <div style="font-size:12px;color:var(--muted)">基线更新: ${data.baseline?.updated_at || '—'}</div>
            </div>`;
        }

        function renderLayerCard(layer) {
            if (layer.missing) {
                return `<div class="layer-card missing">
                    <div class="layer-header">
                        <span><span class="layer-badge" style="background:${LAYER_COLORS[layer.layer] || '#666'}">${layer.layer}</span> ${layer.title}</span>
                    </div>
                    <div class="layer-body">
                        <p style="color:var(--warn)">${layer.message}</p>
                    </div>
                </div>`;
            }
            const color = LAYER_COLORS[layer.layer] || '#666';
            const checks = (layer.checks || []).map(c => `
                <div class="metric-row">
                    <span class="metric-label">
                        <span class="status-dot ${statusClass(c.status)}"></span>${c.label}
                    </span>
                    <span class="metric-value">${formatMetricValue(c)}</span>
                </div>`).join('');
            const passLabel = layer.pass === true ? '达标' : layer.pass === false ? '未达标' : '观测';
            return `<div class="layer-card">
                <div class="layer-header">
                    <span><span class="layer-badge" style="background:${color}">${layer.layer}</span> ${layer.title}</span>
                    <span style="font-size:12px;color:var(--muted)">${passLabel}</span>
                </div>
                <div class="layer-body">${checks}<div class="tool-hint">工具: ${layer.tool}</div></div>
            </div>`;
        }

        function renderBenchmarkTable(modes) {
            if (!modes?.length) return '<p style="color:var(--muted)">暂无 benchmark 结果，运行 make benchmark</p>';
            const rows = modes.map(m => `<tr>
                <td>${m.retrieval_mode}</td>
                <td>${m.chunk_size}</td>
                <td>${m.top_k}</td>
                <td>${fmtPct(m.hit_at_1_rate)}</td>
                <td>${fmtPct(m.hit_at_k_rate)}</td>
                <td>${fmtNum(m.mrr, 3)}</td>
                <td>${fmtMs(m.avg_retrieval_ms)}</td>
            </tr>`).join('');
            return `<div class="table-wrap"><table>
                <thead><tr>
                    <th>模式</th><th>Chunk</th><th>Top-K</th>
                    <th>Hit@1</th><th>Hit@K</th><th>MRR</th><th>延迟</th>
                </tr></thead>
                <tbody>${rows}</tbody>
            </table></div>`;
        }

        function renderRuntime(rt) {
            const hist = rt?.histograms || {};
            const counters = rt?.counters || {};
            const cards = [
                { label: '问答总数', value: Math.round(counters.rag_chat_total || 0) },
                { label: '估算 Token', value: Math.round(counters.rag_tokens_estimated || 0) },
                { label: '检索耗时均值', value: hist.rag_retrieval_seconds ? fmtMs(hist.rag_retrieval_seconds.avg * 1000) : '—' },
                { label: '生成耗时均值', value: hist.rag_generation_seconds ? fmtMs(hist.rag_generation_seconds.avg * 1000) : '—' },
                { label: '好评 👍', value: Math.round(rt.feedback_up || 0) },
                { label: '差评 👎', value: Math.round(rt.feedback_down || 0) },
            ];
            return `<div class="runtime-grid">${cards.map(c => `
                <div class="runtime-card">
                    <div class="label">${c.label}</div>
                    <div class="value">${c.value}</div>
                </div>`).join('')}</div>
                <p style="font-size:12px;color:var(--muted);margin-top:8px">来自运行时 <code>/metrics</code>（进程内累计，重启清零）</p>`;
        }

        function renderWorkflow(cmds) {
            const steps = [
                { t: '调参', c: 'RAG Settings' },
                { t: 'L1', c: cmds.l1 },
                { t: 'L2', c: cmds.l2 },
                { t: 'L3', c: cmds.l3 },
                { t: '门禁', c: cmds.gate },
                { t: '上线', c: '/metrics' },
                { t: '反馈', c: 'POST /api/feedback' },
                { t: '回流', c: cmds.bad_cases },
            ];
            return steps.map((s, i) =>
                (i ? '<span class="workflow-arrow">→</span>' : '') +
                `<span class="workflow-step" title="${s.c}"><strong>${s.t}</strong></span>`
            ).join('');
        }

        function getNodeValue(nodeId) {
            if (!dashboardData) return null;
            const layers = dashboardData.layers || [];
            const l1 = layers.find(l => l.layer === 'L1');
            const l2 = layers.find(l => l.layer === 'L2');
            const l3 = layers.find(l => l.layer === 'L3');
            const l4 = layers.find(l => l.layer === 'L4');
            const map = {
                l1_empty: l1?.summary?.empty_chunk_rate,
                l1_boundary: l1?.summary?.boundary_good_rate,
                l1_chunks_per_doc: l1?.summary?.chunks_per_doc_avg,
                l2_hit1: l2?.summary?.hit_at_1_rate,
                l2_hitk: l2?.summary?.hit_at_k_rate,
                l2_mrr: l2?.summary?.mrr,
                l2_retrieval_ms: l2?.summary?.avg_retrieval_ms,
                l3_faith: l3?.summary?.avg_faithfulness,
                l3_relevancy: l3?.summary?.avg_answer_relevancy,
                l3_gen_ms: l3?.summary?.avg_generation_ms,
                l4_feedback: l4?.summary?.feedback_total,
                l4_bad_cases: l4?.summary?.bad_case_candidates,
            };
            return map[nodeId];
        }

        function layoutMindmap(graph) {
            const W = 1200, H = 600;
            const cx = W / 2, cy = H / 2;
            const positions = {};

            positions.system_quality = { x: cx, y: cy, r: 36 };

            const knobs = graph.nodes.filter(n => n.type === 'knob');
            const metrics = graph.nodes.filter(n => n.type === 'metric');
            const gates = graph.nodes.filter(n => n.type === 'gate');

            const groupAngles = { L1: -Math.PI * 0.75, L2: -Math.PI * 0.35, L3: Math.PI * 0.15, L4: Math.PI * 0.55, ops: Math.PI * 0.85 };
            const groupRadius = { L1: 200, L2: 260, L3: 260, L4: 200, ops: 160 };

            ['L1', 'L2', 'L3', 'L4', 'ops'].forEach(group => {
                const groupMetrics = metrics.filter(n => n.group === group);
                const baseAngle = groupAngles[group];
                const radius = groupRadius[group];
                groupMetrics.forEach((n, i) => {
                    const spread = 0.35;
                    const angle = baseAngle + (i - (groupMetrics.length - 1) / 2) * spread;
                    positions[n.id] = { x: cx + Math.cos(angle) * radius, y: cy + Math.sin(angle) * radius, r: 22 };
                });
            });

            const knobGroups = ['L1', 'L2', 'L3'];
            knobGroups.forEach((group, gi) => {
                const groupKnobs = knobs.filter(n => n.group === group);
                const angle = -Math.PI / 2 + gi * (Math.PI / 3);
                const radius = 420;
                groupKnobs.forEach((n, i) => {
                    const spread = 0.22;
                    const a = angle + (i - (groupKnobs.length - 1) / 2) * spread;
                    positions[n.id] = { x: cx + Math.cos(a) * radius, y: cy + Math.sin(a) * radius, r: 18 };
                });
            });

            gates.forEach((n, i) => {
                positions[n.id] = { x: 80 + i * 90, y: H - 50, r: 20 };
            });

            return { positions, W, H };
        }

        function renderMindmap(graph) {
            const { positions, W, H } = layoutMindmap(graph);
            const nodeById = Object.fromEntries(graph.nodes.map(n => [n.id, n]));
            nodeById.system_quality = graph.root;

            let edgesSvg = '';
            graph.edges.forEach((e, i) => {
                const from = positions[e.from];
                const to = positions[e.to];
                if (!from || !to) return;
                const mx = (from.x + to.x) / 2;
                const my = (from.y + to.y) / 2;
                const hl = graphState.highlight === e.from || graphState.highlight === e.to;
                edgesSvg += `<path class="graph-edge${hl ? ' highlight' : ''}" data-from="${e.from}" data-to="${e.to}"
                    d="M${from.x},${from.y} Q${mx},${my} ${to.x},${to.y}" marker-end="url(#arrow)"/>`;
            });

            let nodesSvg = '';
            const allNodes = [graph.root, ...graph.nodes];
            allNodes.forEach(n => {
                const pos = positions[n.id];
                if (!pos) return;
                const color = n.type === 'outcome' ? NODE_COLORS.outcome
                    : n.type === 'knob' ? NODE_COLORS.knob
                    : n.type === 'gate' ? NODE_COLORS.gate
                    : (LAYER_COLORS[n.group] || NODE_COLORS.metric);
                const val = getNodeValue(n.id);
                let sub = '';
                if (val != null) {
                    if (n.id.includes('ms')) sub = fmtMs(val);
                    else if (typeof val === 'number' && val <= 1) sub = fmtPct(val);
                    else sub = String(Math.round(val));
                }
                const label = sub ? `${n.label}\n${sub}` : n.label;
                const lines = label.split('\n');
                nodesSvg += `<g class="graph-node" data-id="${n.id}" transform="translate(${pos.x},${pos.y})">
                    <circle r="${pos.r}" fill="${color}" fill-opacity="0.25" stroke="${color}"/>
                    ${lines.map((l, i) => `<text text-anchor="middle" dy="${i * 12 - (lines.length-1)*6}">${l}</text>`).join('')}
                </g>`;
            });

            return `<div class="mindmap-wrap">
                <div class="mindmap-toolbar">
                    <span>指标影响思维导图 — 悬停/点击节点查看影响链</span>
                    <div class="legend">
                        <div class="legend-item"><span class="legend-swatch" style="background:#f59e0b"></span>调参旋钮</div>
                        <div class="legend-item"><span class="legend-swatch" style="background:#3b82f6"></span>分层指标</div>
                        <div class="legend-item"><span class="legend-swatch" style="background:#22c55e"></span>系统质量</div>
                        <div class="legend-item"><span class="legend-swatch" style="background:#64748b"></span>运维门禁</div>
                    </div>
                </div>
                <svg id="mindmap-svg" viewBox="0 0 ${W} ${H}">
                    <defs>
                        <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
                            <path d="M0,0 L6,3 L0,6 Z" fill="#3d5270"/>
                        </marker>
                    </defs>
                    <g id="graph-root" transform="translate(${graphState.tx},${graphState.ty}) scale(${graphState.scale})">
                        ${edgesSvg}${nodesSvg}
                    </g>
                </svg>
                <div class="detail-panel" id="graphDetail">点击节点查看：调参旋钮 → 分层指标 → 系统质量 / 基线门禁</div>
            </div>`;
        }

        function bindMindmapEvents(graph) {
            const svg = document.getElementById('mindmap-svg');
            const detail = document.getElementById('graphDetail');
            if (!svg) return;

            svg.querySelectorAll('.graph-node').forEach(el => {
                el.addEventListener('click', () => {
                    const id = el.dataset.id;
                    graphState.highlight = id;
                    const node = id === 'system_quality' ? graph.root : graph.nodes.find(n => n.id === id);
                    const incoming = graph.edges.filter(e => e.to === id);
                    const outgoing = graph.edges.filter(e => e.from === id);
                    let html = `<strong>${node?.label || id}</strong>`;
                    const val = getNodeValue(id);
                    if (val != null) html += ` · 当前值: ${typeof val === 'number' && val <= 1 && !id.includes('ms') ? fmtPct(val) : (id.includes('ms') ? fmtMs(val) : val)}`;
                    if (incoming.length) html += '<br>↑ 受影响于: ' + incoming.map(e => {
                        const from = graph.nodes.find(n => n.id === e.from) || (e.from === 'system_quality' ? graph.root : null);
                        return `${from?.label || e.from}（${e.effect}）`;
                    }).join('；');
                    if (outgoing.length) html += '<br>↓ 影响: ' + outgoing.map(e => {
                        const to = graph.nodes.find(n => n.id === e.to) || (e.to === 'system_quality' ? graph.root : null);
                        return `${to?.label || e.to}（${e.effect}）`;
                    }).join('；');
                    detail.innerHTML = html;
                    svg.querySelectorAll('.graph-edge').forEach(path => {
                        const from = path.dataset.from;
                        const to = path.dataset.to;
                        const hl = from === id || to === id;
                        path.classList.toggle('highlight', hl);
                    });
                });
            });

            let dragging = false, lastX, lastY;
            svg.addEventListener('mousedown', e => { dragging = true; lastX = e.clientX; lastY = e.clientY; });
            window.addEventListener('mouseup', () => dragging = false);
            window.addEventListener('mousemove', e => {
                if (!dragging) return;
                graphState.tx += e.clientX - lastX;
                graphState.ty += e.clientY - lastY;
                lastX = e.clientX; lastY = e.clientY;
                const g = document.getElementById('graph-root');
                if (g) g.setAttribute('transform', `translate(${graphState.tx},${graphState.ty}) scale(${graphState.scale})`);
            });
            svg.addEventListener('wheel', e => {
                e.preventDefault();
                const delta = e.deltaY > 0 ? 0.9 : 1.1;
                graphState.scale = Math.min(2, Math.max(0.4, graphState.scale * delta));
                const g = document.getElementById('graph-root');
                if (g) g.setAttribute('transform', `translate(${graphState.tx},${graphState.ty}) scale(${graphState.scale})`);
            }, { passive: false });
        }

        function renderApp() {
            const data = dashboardData;
            if (!data) return;
            const app = document.getElementById('app');
            const cases = data.benchmark_cases || {};
            app.innerHTML = `
                ${renderGate(data)}
                <div class="section">
                    <h2>闭环工作流</h2>
                    <div class="workflow">${renderWorkflow(data.commands)}</div>
                </div>
                <div class="section">
                    <h2>分层指标 · L1–L4（${cases.total || 0} 条用例，${cases.with_expected_answer || 0} 条含标准答案）</h2>
                    <div class="layer-grid">${(data.layers || []).map(renderLayerCard).join('')}</div>
                </div>
                <div class="section">
                    <h2>指标影响思维导图</h2>
                    ${renderMindmap(data.influence_graph)}
                </div>
                <div class="section">
                    <h2>L2 检索模式对比</h2>
                    ${renderBenchmarkTable(data.benchmark_modes)}
                </div>
                <div class="section">
                    <h2>运行时观测 · 生产参考</h2>
                    ${renderRuntime(data.runtime_metrics)}
                </div>`;
            bindMindmapEvents(data.influence_graph);
        }

        async function loadDashboard() {
            try {
                const res = await fetch('/api/eval/dashboard');
                if (!res.ok) throw new Error(res.statusText);
                dashboardData = await res.json();
                document.getElementById('updatedAt').textContent =
                    '更新: ' + new Date(dashboardData.generated_at).toLocaleString('zh-CN');
                renderApp();
            } catch (err) {
                document.getElementById('app').innerHTML =
                    `<div class="loading" style="color:var(--fail)">加载失败: ${err.message}<br>请确认服务已启动 (make dev)</div>`;
            }
        }

        document.getElementById('refreshBtn').addEventListener('click', loadDashboard);
        loadDashboard();
    </script>
</body>
</html>
