<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>企业知识库问答</title>
    <style>
        :root {
            --bg: #0f1419;
            --surface: #1a2332;
            --border: #2d3a4f;
            --text: #e7ecf3;
            --muted: #8b9cb3;
            --accent: #3b82f6;
            --accent-hover: #2563eb;
            --user-bg: #1e3a5f;
            --bot-bg: #1a2332;
            --success: #22c55e;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        header {
            padding: 16px 24px;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--surface);
        }
        header h1 { font-size: 18px; font-weight: 600; }
        header .status { font-size: 13px; color: var(--muted); }
        .main {
            flex: 1;
            display: flex;
            overflow: hidden;
        }
        .sidebar {
            width: 300px;
            border-right: 1px solid var(--border);
            background: var(--surface);
            display: flex;
            flex-direction: column;
            overflow-y: auto;
        }
        .sidebar h2 {
            padding: 16px;
            font-size: 14px;
            color: var(--muted);
            border-bottom: 1px solid var(--border);
        }
        .upload-area {
            padding: 16px;
            border-bottom: 1px solid var(--border);
        }
        .upload-area input[type="file"] { display: none; }
        .upload-btn {
            display: block;
            width: 100%;
            padding: 10px;
            background: var(--accent);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            text-align: center;
        }
        .upload-btn:hover { background: var(--accent-hover); }
        .doc-list {
            flex: 1;
            overflow-y: auto;
            padding: 8px;
        }
        .doc-item {
            padding: 10px 12px;
            border-radius: 8px;
            margin-bottom: 4px;
            font-size: 13px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .doc-item:hover { background: rgba(255,255,255,0.05); }
        .doc-item .name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .doc-item .meta { font-size: 11px; color: var(--muted); }
        .doc-item .status-ready { color: var(--success); }
        .doc-item .status-processing { color: #f59e0b; }
        .doc-item .status-failed { color: #ef4444; }
        .chat-area {
            flex: 1;
            display: flex;
            flex-direction: column;
        }
        .messages {
            flex: 1;
            overflow-y: auto;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        .message {
            max-width: 80%;
            padding: 12px 16px;
            border-radius: 12px;
            font-size: 14px;
            line-height: 1.6;
            white-space: pre-wrap;
        }
        .message.user {
            align-self: flex-end;
            background: var(--user-bg);
        }
        .message.bot {
            align-self: flex-start;
            background: var(--bot-bg);
            border: 1px solid var(--border);
        }
        .sources {
            margin-top: 8px;
            padding-top: 8px;
            border-top: 1px solid var(--border);
            font-size: 12px;
            color: var(--muted);
        }
        .input-area {
            padding: 16px 24px;
            border-top: 1px solid var(--border);
            display: flex;
            gap: 12px;
        }
        .input-area input {
            flex: 1;
            padding: 12px 16px;
            border: 1px solid var(--border);
            border-radius: 8px;
            background: var(--surface);
            color: var(--text);
            font-size: 14px;
            outline: none;
        }
        .input-area input:focus { border-color: var(--accent); }
        .input-area button {
            padding: 12px 24px;
            background: var(--accent);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
        }
        .input-area button:hover { background: var(--accent-hover); }
        .input-area button:disabled { opacity: 0.5; cursor: not-allowed; }
        .settings-panel {
            padding: 16px;
            border-bottom: 1px solid var(--border);
        }
        .settings-section {
            margin-top: 12px;
            padding-top: 12px;
            border-top: 1px solid var(--border);
        }
        .settings-section h4 {
            font-size: 12px;
            color: var(--muted);
            margin-bottom: 10px;
            font-weight: 600;
        }
        .field textarea {
            width: 100%;
            min-height: 72px;
            padding: 8px 10px;
            border: 1px solid var(--border);
            border-radius: 6px;
            background: var(--bg);
            color: var(--text);
            font-size: 12px;
            line-height: 1.4;
            resize: vertical;
        }
        .field-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            font-size: 12px;
            color: var(--muted);
            margin-bottom: 10px;
        }
        .field-row input[type="checkbox"] {
            accent-color: var(--accent);
        }
        .field-row.warn-label {
            color: #f59e0b;
            font-size: 11px;
            line-height: 1.4;
        }
        .settings-panel h3 {
            font-size: 14px;
            color: var(--muted);
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .settings-panel h3 button {
            background: none;
            border: none;
            color: var(--accent);
            font-size: 12px;
            cursor: pointer;
            padding: 0;
        }
        .field {
            margin-bottom: 12px;
        }
        .field label {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            color: var(--muted);
            margin-bottom: 6px;
        }
        .field label span.value {
            color: var(--text);
            font-variant-numeric: tabular-nums;
        }
        .field input[type="range"] {
            width: 100%;
            accent-color: var(--accent);
        }
        .field input[type="number"] {
            width: 100%;
            padding: 8px 10px;
            border: 1px solid var(--border);
            border-radius: 6px;
            background: var(--bg);
            color: var(--text);
            font-size: 13px;
        }
        .settings-actions {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-top: 12px;
        }
        .settings-actions button {
            width: 100%;
            padding: 8px 10px;
            border-radius: 8px;
            border: 1px solid var(--border);
            background: var(--bg);
            color: var(--text);
            font-size: 13px;
            cursor: pointer;
        }
        .settings-actions button.primary {
            background: var(--accent);
            border-color: var(--accent);
            color: white;
        }
        .settings-actions button.primary:hover { background: var(--accent-hover); }
        .settings-actions button:disabled { opacity: 0.5; cursor: not-allowed; }
        .settings-hint {
            margin-top: 10px;
            font-size: 11px;
            line-height: 1.5;
            color: var(--muted);
        }
        .settings-hint.warn { color: #f59e0b; }
        .settings-hint.ok { color: var(--success); }
        .preview-box {
            margin-top: 10px;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid var(--border);
            background: var(--bg);
            font-size: 11px;
            line-height: 1.5;
            color: var(--muted);
            max-height: 140px;
            overflow-y: auto;
            white-space: pre-wrap;
        }
    </style>
</head>
<body>
    <header>
        <h1>企业知识库问答 Agent</h1>
        <div class="status" id="status">加载中...</div>
    </header>
    <div class="main">
        <aside class="sidebar">
            <h2>知识库文档</h2>
            <div class="upload-area">
                <label class="upload-btn">
                    上传文档
                    <input type="file" id="fileInput" accept=".pdf,.doc,.docx,.md,.txt,.html">
                </label>
            </div>
            <div class="settings-panel">
                <h3>
                    RAG 参数
                    <button type="button" id="resetSettingsBtn">恢复默认</button>
                </h3>

                <div class="settings-section">
                    <h4>检索</h4>
                    <div class="field">
                        <label for="retrievalModeInput">检索模式</label>
                        <select id="retrievalModeInput">
                            <option value="vector">纯向量</option>
                            <option value="hybrid">混合检索 (BM25 + 向量)</option>
                        </select>
                    </div>
                    <div class="field" id="hybridAlphaField">
                        <label>向量权重 α <span class="value" id="hybridAlphaValue">0.50</span></label>
                        <input type="range" id="hybridAlphaInput" min="0" max="1" step="0.05" value="0.5">
                    </div>
                    <div class="field" id="rrfKField">
                        <label>RRF 常数 K <span class="value" id="rrfKValue">60</span></label>
                        <input type="range" id="rrfKInput" min="10" max="120" step="5" value="60">
                    </div>
                    <div class="field-row" id="esStatusRow">
                        <span>ES 状态：<strong id="esStatusText">-</strong></span>
                    </div>
                    <div class="field-row" id="infraStatusRow">
                        <span>向量库：<strong id="vectorStoreText">-</strong></span>
                        <span>存储：<strong id="storageBackendText">-</strong></span>
                    </div>
                    <div class="field">
                        <label>Top-K <span class="value" id="topKValue">4</span></label>
                        <input type="range" id="topKInput" min="1" max="10" step="1" value="4">
                    </div>
                    <div class="field">
                        <label>Fetch-K <span class="value" id="fetchKValue">20</span></label>
                        <input type="range" id="fetchKInput" min="4" max="50" step="1" value="20">
                    </div>
                    <div class="field">
                        <label>相似度阈值 (L2，留空=不过滤)</label>
                        <input type="number" id="scoreThresholdInput" min="0" step="0.01" placeholder="不过滤">
                    </div>
                    <div class="field-row">
                        <label for="useMmrInput">启用 MMR 多样性</label>
                        <input type="checkbox" id="useMmrInput">
                    </div>
                    <div class="field">
                        <label>MMR Lambda <span class="value" id="mmrLambdaValue">0.5</span></label>
                        <input type="range" id="mmrLambdaInput" min="0" max="1" step="0.05" value="0.5">
                    </div>
                    <div class="field-row">
                        <label for="useRerankInput">启用 Rerank 重排</label>
                        <input type="checkbox" id="useRerankInput">
                    </div>
                    <div class="field-row warn-label">Rerank 约额外占用 400MB 内存，低内存设备请谨慎开启</div>
                </div>

                <div class="settings-section">
                    <h4>生成</h4>
                    <div class="field">
                        <label>Temperature <span class="value" id="temperatureValue">0.2</span></label>
                        <input type="range" id="temperatureInput" min="0" max="1" step="0.05" value="0.2">
                    </div>
                    <div class="field">
                        <label>历史轮数 <span class="value" id="historyTurnsValue">3</span></label>
                        <input type="range" id="historyTurnsInput" min="0" max="10" step="1" value="3">
                    </div>
                    <div class="field">
                        <label>最大上下文字符数 <span class="value" id="maxContextCharsValue">4000</span></label>
                        <input type="range" id="maxContextCharsInput" min="500" max="8000" step="100" value="4000">
                    </div>
                    <div class="field">
                        <label>预览 Snippet 长度 <span class="value" id="snippetLengthValue">200</span></label>
                        <input type="range" id="snippetLengthInput" min="50" max="500" step="10" value="200">
                    </div>
                    <div class="field">
                        <label>System Prompt</label>
                        <textarea id="systemPromptInput" placeholder="企业知识库助手系统提示词"></textarea>
                    </div>
                </div>

                <div class="settings-section">
                    <h4>索引</h4>
                    <div class="field">
                        <label>Chunk Size <span class="value" id="chunkSizeValue">512</span></label>
                        <input type="range" id="chunkSizeInput" min="128" max="2048" step="64" value="512">
                    </div>
                    <div class="field">
                        <label>Chunk Overlap <span class="value" id="chunkOverlapValue">64</span></label>
                        <input type="range" id="chunkOverlapInput" min="0" max="256" step="16" value="64">
                    </div>
                </div>

                <div class="settings-actions">
                    <button type="button" class="primary" id="applySettingsBtn">应用参数</button>
                    <button type="button" id="reindexBtn" disabled>重建索引</button>
                    <button type="button" id="syncEsBtn" disabled>同步 ES 索引</button>
                    <button type="button" id="previewBtn">预览检索效果</button>
                </div>
                <div class="settings-hint" id="settingsHint">
                    检索/生成参数应用后立即生效；Chunk 参数需重建索引。
                </div>
                <div class="preview-box" id="previewBox" hidden></div>
            </div>
            <div class="doc-list" id="docList"></div>
        </aside>
        <section class="chat-area">
            <div class="messages" id="messages">
                <div class="message bot">你好！我是企业知识库助手。可以问我关于退款政策、远程办公制度、IT 服务台 FAQ 等问题。</div>
            </div>
            <div class="input-area">
                <input type="text" id="questionInput" placeholder="输入你的问题，例如：退款需要几天到账？" />
                <button id="sendBtn">发送</button>
            </div>
        </section>
    </div>

    <script>
        let conversationId = null;
        let ragSettings = null;

        const DEFAULT_SETTINGS = {
            topK: 4,
            chunkSize: 512,
            chunkOverlap: 64,
            fetchK: 20,
            scoreThreshold: null,
            useMmr: false,
            mmrLambda: 0.5,
            useRerank: false,
            temperature: 0.2,
            historyTurns: 3,
            maxContextChars: 4000,
            systemPrompt: '你是企业内部知识库助手。仅根据提供的上下文回答，不知道就说不知道。回答简洁，并在末尾列出引用文档名。',
            snippetLength: 200,
            retrievalMode: 'vector',
            hybridAlpha: 0.5,
            rrfK: 60,
        };

        async function init() {
            const res = await fetch('/api/chat/conversation', { method: 'POST' });
            const data = await res.json();
            conversationId = data.conversationId;
            await loadHealth();
            await loadDocuments();
            await loadRagSettings();
        }

        function bindRangeInput(rangeId, valueId, formatter) {
            const range = document.getElementById(rangeId);
            const value = document.getElementById(valueId);
            range.addEventListener('input', () => {
                value.textContent = formatter ? formatter(range.value) : range.value;
            });
        }

        bindRangeInput('topKInput', 'topKValue');
        bindRangeInput('fetchKInput', 'fetchKValue');
        bindRangeInput('mmrLambdaInput', 'mmrLambdaValue', v => Number(v).toFixed(2));
        bindRangeInput('temperatureInput', 'temperatureValue', v => Number(v).toFixed(2));
        bindRangeInput('historyTurnsInput', 'historyTurnsValue');
        bindRangeInput('maxContextCharsInput', 'maxContextCharsValue');
        bindRangeInput('snippetLengthInput', 'snippetLengthValue');
        bindRangeInput('chunkSizeInput', 'chunkSizeValue');
        bindRangeInput('chunkOverlapInput', 'chunkOverlapValue');
        bindRangeInput('hybridAlphaInput', 'hybridAlphaValue', v => Number(v).toFixed(2));
        bindRangeInput('rrfKInput', 'rrfKValue');

        document.getElementById('retrievalModeInput').addEventListener('change', syncRetrievalMode);
        document.getElementById('useMmrInput').addEventListener('change', syncRetrievalMode);
        document.getElementById('useRerankInput').addEventListener('change', syncRetrievalMode);

        function syncRetrievalMode(event) {
            const mmr = document.getElementById('useMmrInput');
            const rerank = document.getElementById('useRerankInput');
            const mode = document.getElementById('retrievalModeInput').value;
            const hybrid = mode === 'hybrid';

            document.getElementById('hybridAlphaField').style.display = hybrid ? 'block' : 'none';
            document.getElementById('rrfKField').style.display = hybrid ? 'block' : 'none';

            if (hybrid && mmr.checked) {
                mmr.checked = false;
            }

            if (mmr.checked && rerank.checked) {
                if (event && event.target === mmr) {
                    rerank.checked = false;
                } else {
                    mmr.checked = false;
                }
            }
        }

        function readSettingsForm() {
            const thresholdRaw = document.getElementById('scoreThresholdInput').value.trim();
            const payload = {
                topK: Number(document.getElementById('topKInput').value),
                fetchK: Number(document.getElementById('fetchKInput').value),
                useMmr: document.getElementById('useMmrInput').checked,
                mmrLambda: Number(document.getElementById('mmrLambdaInput').value),
                useRerank: document.getElementById('useRerankInput').checked,
                temperature: Number(document.getElementById('temperatureInput').value),
                historyTurns: Number(document.getElementById('historyTurnsInput').value),
                maxContextChars: Number(document.getElementById('maxContextCharsInput').value),
                systemPrompt: document.getElementById('systemPromptInput').value.trim(),
                snippetLength: Number(document.getElementById('snippetLengthInput').value),
                chunkSize: Number(document.getElementById('chunkSizeInput').value),
                chunkOverlap: Number(document.getElementById('chunkOverlapInput').value),
                retrievalMode: document.getElementById('retrievalModeInput').value,
                hybridAlpha: Number(document.getElementById('hybridAlphaInput').value),
                rrfK: Number(document.getElementById('rrfKInput').value),
            };
            payload.scoreThreshold = thresholdRaw ? Number(thresholdRaw) : null;
            return payload;
        }

        function fillSettingsForm(settings) {
            document.getElementById('topKInput').value = settings.topK;
            document.getElementById('topKValue').textContent = settings.topK;
            document.getElementById('fetchKInput').value = settings.fetchK;
            document.getElementById('fetchKValue').textContent = settings.fetchK;
            document.getElementById('scoreThresholdInput').value =
                settings.scoreThreshold == null ? '' : settings.scoreThreshold;
            document.getElementById('useMmrInput').checked = !!settings.useMmr;
            document.getElementById('mmrLambdaInput').value = settings.mmrLambda;
            document.getElementById('mmrLambdaValue').textContent = Number(settings.mmrLambda).toFixed(2);
            document.getElementById('useRerankInput').checked = !!settings.useRerank;
            document.getElementById('temperatureInput').value = settings.temperature;
            document.getElementById('temperatureValue').textContent = Number(settings.temperature).toFixed(2);
            document.getElementById('historyTurnsInput').value = settings.historyTurns;
            document.getElementById('historyTurnsValue').textContent = settings.historyTurns;
            document.getElementById('maxContextCharsInput').value = settings.maxContextChars;
            document.getElementById('maxContextCharsValue').textContent = settings.maxContextChars;
            document.getElementById('snippetLengthInput').value = settings.snippetLength;
            document.getElementById('snippetLengthValue').textContent = settings.snippetLength;
            document.getElementById('systemPromptInput').value = settings.systemPrompt || DEFAULT_SETTINGS.systemPrompt;
            document.getElementById('chunkSizeInput').value = settings.chunkSize;
            document.getElementById('chunkSizeValue').textContent = settings.chunkSize;
            document.getElementById('chunkOverlapInput').value = settings.chunkOverlap;
            document.getElementById('chunkOverlapValue').textContent = settings.chunkOverlap;
            document.getElementById('retrievalModeInput').value = settings.retrievalMode || 'vector';
            document.getElementById('hybridAlphaInput').value = settings.hybridAlpha ?? 0.5;
            document.getElementById('hybridAlphaValue').textContent = Number(settings.hybridAlpha ?? 0.5).toFixed(2);
            document.getElementById('rrfKInput').value = settings.rrfK ?? 60;
            document.getElementById('rrfKValue').textContent = settings.rrfK ?? 60;
            updateEsStatus(settings);
            updateInfraStatus(settings);
            syncRetrievalMode();
            updateSettingsHint(settings);
        }

        function updateInfraStatus(settings) {
            const vectorEl = document.getElementById('vectorStoreText');
            const storageEl = document.getElementById('storageBackendText');
            const vectorCount = settings.vectorChunkCount ?? 0;
            vectorEl.textContent = `${settings.vectorStore || 'chroma'} / ${settings.vectorStatus || 'connected'} (${vectorCount})`;
            storageEl.textContent = `${settings.storageBackend || 'local'} / ${settings.storageStatus || 'connected'}`;
        }

        function updateEsStatus(settings) {
            const statusEl = document.getElementById('esStatusText');
            const syncBtn = document.getElementById('syncEsBtn');
            if (!settings.esEnabled) {
                statusEl.textContent = '未配置';
                syncBtn.disabled = true;
                return;
            }
            const count = settings.esChunkCount ?? 0;
            statusEl.textContent = `${settings.esStatus} (${count} 片段)`;
            syncBtn.disabled = settings.esStatus !== 'connected';
        }

        function updateSettingsHint(settings) {
            const hint = document.getElementById('settingsHint');
            const reindexBtn = document.getElementById('reindexBtn');
            reindexBtn.disabled = !settings.needsReindex;

            const mode = settings.retrievalMode === 'hybrid'
                ? '混合检索'
                : (settings.useRerank ? 'Rerank' : (settings.useMmr ? 'MMR' : '向量'));
            if (settings.needsReindex) {
                hint.className = 'settings-hint warn';
                hint.textContent =
                    `当前索引 chunk=${settings.indexedChunkSize}, overlap=${settings.indexedChunkOverlap}；` +
                    `检索模式=${mode}。Chunk 变更需重建索引，其余参数已可即时调试。`;
            } else {
                hint.className = 'settings-hint ok';
                hint.textContent = `参数已同步。检索模式=${mode}；检索/生成参数立即生效。`;
            }
        }

        async function loadRagSettings() {
            const res = await fetch('/api/settings/rag');
            ragSettings = await res.json();
            fillSettingsForm(ragSettings);
        }

        async function applyRagSettings() {
            syncRetrievalMode();
            const payload = readSettingsForm();
            const btn = document.getElementById('applySettingsBtn');
            btn.disabled = true;
            try {
                const res = await fetch('/api/settings/rag', {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload),
                });
                const data = await res.json();
                if (!res.ok) {
                    throw new Error(data.detail || '参数更新失败');
                }
                ragSettings = data;
                fillSettingsForm(ragSettings);
            } catch (e) {
                document.getElementById('settingsHint').className = 'settings-hint warn';
                document.getElementById('settingsHint').textContent = e.message;
            } finally {
                btn.disabled = false;
            }
        }

        async function reindexDocuments() {
            const btn = document.getElementById('reindexBtn');
            btn.disabled = true;
            btn.textContent = '重建中...';
            try {
                const res = await fetch('/api/settings/rag/reindex', { method: 'POST' });
                const data = await res.json();
                if (!res.ok) {
                    throw new Error(data.detail || '重建索引失败');
                }
                await loadRagSettings();
                await loadDocuments();
                await loadHealth();
                document.getElementById('settingsHint').className = 'settings-hint ok';
                document.getElementById('settingsHint').textContent = data.message;
            } catch (e) {
                document.getElementById('settingsHint').className = 'settings-hint warn';
                document.getElementById('settingsHint').textContent = e.message;
            } finally {
                btn.textContent = '重建索引';
                btn.disabled = !ragSettings?.needsReindex;
            }
        }

        async function previewRetrieval() {
            const question = document.getElementById('questionInput').value.trim()
                || '退款多久到账？';
            const box = document.getElementById('previewBox');
            box.hidden = false;
            box.textContent = '检索中...';

            try {
                const res = await fetch(`/api/chat/sources?question=${encodeURIComponent(question)}`);
                const sources = await res.json();
                if (!sources.length) {
                    box.textContent = '未检索到相关片段，请确认知识库已有文档。';
                    return;
                }
                box.textContent = sources.map((s, i) =>
                    `#${i + 1} ${s.filename} (score=${s.score.toFixed(4)})\n${s.snippet}`
                ).join('\n\n');
            } catch {
                box.textContent = '预览失败，请检查服务状态。';
            }
        }

        async function syncEsIndex() {
            const btn = document.getElementById('syncEsBtn');
            btn.disabled = true;
            btn.textContent = '同步中...';
            try {
                const res = await fetch('/api/settings/rag/sync-es', { method: 'POST' });
                const data = await res.json();
                if (!res.ok) {
                    throw new Error(data.detail || 'ES 同步失败');
                }
                await loadRagSettings();
                await loadDocuments();
                await loadHealth();
                document.getElementById('settingsHint').className = 'settings-hint ok';
                document.getElementById('settingsHint').textContent = data.message;
            } catch (e) {
                document.getElementById('settingsHint').className = 'settings-hint warn';
                document.getElementById('settingsHint').textContent = e.message;
            } finally {
                btn.textContent = '同步 ES 索引';
                btn.disabled = !ragSettings?.esEnabled || ragSettings?.esStatus !== 'connected';
            }
        }

        document.getElementById('applySettingsBtn').addEventListener('click', applyRagSettings);
        document.getElementById('reindexBtn').addEventListener('click', reindexDocuments);
        document.getElementById('syncEsBtn').addEventListener('click', syncEsIndex);
        document.getElementById('previewBtn').addEventListener('click', previewRetrieval);
        document.getElementById('resetSettingsBtn').addEventListener('click', () => {
            fillSettingsForm({
                ...DEFAULT_SETTINGS,
                needsReindex: ragSettings?.needsReindex,
                indexedChunkSize: ragSettings?.indexedChunkSize,
                indexedChunkOverlap: ragSettings?.indexedChunkOverlap,
            });
        });

        async function loadHealth() {
            try {
                const res = await fetch('/api/health');
                const data = await res.json();
                document.getElementById('status').textContent =
                    `已就绪 ${data.ready_documents}/${data.documents} 篇 · ${data.retrievalMode} · Vector:${data.vectorStore}/${data.vectorStatus} · Storage:${data.storageBackend} · ES:${data.esStatus} · Redis:${data.redisStatus}`;
            } catch {
                document.getElementById('status').textContent = '服务未连接';
            }
        }

        function statusClass(status) {
            if (status === 'READY') return 'status-ready';
            if (status === 'PROCESSING' || status === 'PENDING') return 'status-processing';
            if (status === 'FAILED') return 'status-failed';
            return '';
        }

        async function loadDocuments() {
            const res = await fetch('/api/documents');
            const docs = await res.json();
            const list = document.getElementById('docList');
            list.innerHTML = docs.map(d => `
                <div class="doc-item">
                    <div>
                        <div class="name">${d.filename}</div>
                        <div class="meta">${d.chunkCount} 片段 · ${formatSize(d.fileSize)}</div>
                    </div>
                    <span class="${statusClass(d.status)}">${d.status}</span>
                </div>
            `).join('') || '<div style="padding:16px;color:#8b9cb3;font-size:13px">暂无文档</div>';
            return docs;
        }

        async function pollJobUntilDone(jobId) {
            const maxAttempts = 120;
            for (let i = 0; i < maxAttempts; i++) {
                await new Promise(r => setTimeout(r, 2000));
                try {
                    const res = await fetch(`/api/jobs/${jobId}`);
                    if (!res.ok) continue;
                    const job = await res.json();
                    if (job.status === 'COMPLETED') {
                        addMessage(job.message, 'bot');
                        await loadDocuments();
                        await loadHealth();
                        return;
                    }
                    if (job.status === 'FAILED') {
                        addMessage(`入库失败: ${job.error || job.message}`, 'bot');
                        await loadDocuments();
                        return;
                    }
                } catch {
                    // retry
                }
            }
            addMessage('入库任务超时，请稍后刷新文档列表', 'bot');
        }

        function formatSize(bytes) {
            if (bytes < 1024) return bytes + ' B';
            if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
            return (bytes / 1024 / 1024).toFixed(1) + ' MB';
        }

        function addMessage(text, role) {
            const div = document.createElement('div');
            div.className = `message ${role}`;
            div.textContent = text;
            document.getElementById('messages').appendChild(div);
            div.scrollIntoView({ behavior: 'smooth' });
            return div;
        }

        async function sendQuestion() {
            const input = document.getElementById('questionInput');
            const question = input.value.trim();
            if (!question) return;

            const btn = document.getElementById('sendBtn');
            btn.disabled = true;
            input.value = '';
            addMessage(question, 'user');

            const botMsg = addMessage('', 'bot');

            try {
                const res = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ question, conversationId })
                });
                const data = await res.json();
                botMsg.textContent = data.answer;
                if (data.sources && data.sources.length > 0) {
                    const sources = document.createElement('div');
                    sources.className = 'sources';
                    sources.textContent = '引用: ' + data.sources.map(s => s.filename).join(', ');
                    botMsg.appendChild(sources);
                }
            } catch (e) {
                botMsg.textContent = '请求失败，请检查 API Key 配置和服务状态。';
            }

            btn.disabled = false;
            input.focus();
        }

        document.getElementById('sendBtn').addEventListener('click', sendQuestion);
        document.getElementById('questionInput').addEventListener('keydown', e => {
            if (e.key === 'Enter') sendQuestion();
        });

        document.getElementById('fileInput').addEventListener('change', async e => {
            const file = e.target.files[0];
            if (!file) return;
            const formData = new FormData();
            formData.append('file', file);
            addMessage(`正在上传: ${file.name}...`, 'bot');
            try {
                const res = await fetch('/api/documents/upload', { method: 'POST', body: formData });
                const data = await res.json();
                if (!res.ok) {
                    addMessage(data.detail || '上传失败', 'bot');
                    return;
                }
                addMessage(data.message, 'bot');
                await loadDocuments();
                await loadHealth();
                if (data.status === 'PROCESSING' && data.jobId) {
                    pollJobUntilDone(data.jobId);
                }
            } catch {
                addMessage('上传失败', 'bot');
            }
            e.target.value = '';
        });

        init();
    </script>
</body>
</html>
