<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>企业知识库问答</title>
    <style>
        :root {
            --bg: #0f1419;
            --surface: #1a2332;
            --border: #2d3a4f;
            --text: #e7ecf3;
            --muted: #8b9cb3;
            --accent: #3b82f6;
            --accent-hover: #2563eb;
            --user-bg: #1e3a5f;
            --bot-bg: #1a2332;
            --success: #22c55e;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        header {
            padding: 16px 24px;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--surface);
        }
        header h1 { font-size: 18px; font-weight: 600; }
        header .status { font-size: 13px; color: var(--muted); }
        .main {
            flex: 1;
            display: flex;
            overflow: hidden;
        }
        .sidebar {
            width: 300px;
            border-right: 1px solid var(--border);
            background: var(--surface);
            display: flex;
            flex-direction: column;
        }
        .sidebar h2 {
            padding: 16px;
            font-size: 14px;
            color: var(--muted);
            border-bottom: 1px solid var(--border);
        }
        .upload-area {
            padding: 16px;
            border-bottom: 1px solid var(--border);
        }
        .upload-area input[type="file"] { display: none; }
        .upload-btn {
            display: block;
            width: 100%;
            padding: 10px;
            background: var(--accent);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            text-align: center;
        }
        .upload-btn:hover { background: var(--accent-hover); }
        .doc-list {
            flex: 1;
            overflow-y: auto;
            padding: 8px;
        }
        .doc-item {
            padding: 10px 12px;
            border-radius: 8px;
            margin-bottom: 4px;
            font-size: 13px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .doc-item:hover { background: rgba(255,255,255,0.05); }
        .doc-item .name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .doc-item .meta { font-size: 11px; color: var(--muted); }
        .doc-item .status-ready { color: var(--success); }
        .chat-area {
            flex: 1;
            display: flex;
            flex-direction: column;
        }
        .messages {
            flex: 1;
            overflow-y: auto;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        .message {
            max-width: 80%;
            padding: 12px 16px;
            border-radius: 12px;
            font-size: 14px;
            line-height: 1.6;
            white-space: pre-wrap;
        }
        .message.user {
            align-self: flex-end;
            background: var(--user-bg);
        }
        .message.bot {
            align-self: flex-start;
            background: var(--bot-bg);
            border: 1px solid var(--border);
        }
        .sources {
            margin-top: 8px;
            padding-top: 8px;
            border-top: 1px solid var(--border);
            font-size: 12px;
            color: var(--muted);
        }
        .input-area {
            padding: 16px 24px;
            border-top: 1px solid var(--border);
            display: flex;
            gap: 12px;
        }
        .input-area input {
            flex: 1;
            padding: 12px 16px;
            border: 1px solid var(--border);
            border-radius: 8px;
            background: var(--surface);
            color: var(--text);
            font-size: 14px;
            outline: none;
        }
        .input-area input:focus { border-color: var(--accent); }
        .input-area button {
            padding: 12px 24px;
            background: var(--accent);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
        }
        .input-area button:hover { background: var(--accent-hover); }
        .input-area button:disabled { opacity: 0.5; cursor: not-allowed; }
    </style>
</head>
<body>
    <header>
        <h1>企业知识库问答 Agent</h1>
        <div class="status" id="status">加载中...</div>
    </header>
    <div class="main">
        <aside class="sidebar">
            <h2>知识库文档</h2>
            <div class="upload-area">
                <label class="upload-btn">
                    上传文档
                    <input type="file" id="fileInput" accept=".pdf,.doc,.docx,.md,.txt,.html">
                </label>
            </div>
            <div class="doc-list" id="docList"></div>
        </aside>
        <section class="chat-area">
            <div class="messages" id="messages">
                <div class="message bot">你好！我是企业知识库助手。可以问我关于退款政策、远程办公制度、IT 服务台 FAQ 等问题。</div>
            </div>
            <div class="input-area">
                <input type="text" id="questionInput" placeholder="输入你的问题，例如：退款需要几天到账？" />
                <button id="sendBtn">发送</button>
            </div>
        </section>
    </div>

    <script>
        let conversationId = null;

        async function init() {
            const res = await fetch('/api/chat/conversation', { method: 'POST' });
            const data = await res.json();
            conversationId = data.conversationId;
            await loadHealth();
            await loadDocuments();
        }

        async function loadHealth() {
            try {
                const res = await fetch('/api/health');
                const data = await res.json();
                document.getElementById('status').textContent =
                    `已就绪 ${data.readyDocuments}/${data.documents} 篇文档`;
            } catch {
                document.getElementById('status').textContent = '服务未连接';
            }
        }

        async function loadDocuments() {
            const res = await fetch('/api/documents');
            const docs = await res.json();
            const list = document.getElementById('docList');
            list.innerHTML = docs.map(d => `
                <div class="doc-item">
                    <div>
                        <div class="name">${d.filename}</div>
                        <div class="meta">${d.chunkCount} 片段 · ${formatSize(d.fileSize)}</div>
                    </div>
                    <span class="${d.status === 'READY' ? 'status-ready' : ''}">${d.status}</span>
                </div>
            `).join('') || '<div style="padding:16px;color:#8b9cb3;font-size:13px">暂无文档</div>';
        }

        function formatSize(bytes) {
            if (bytes < 1024) return bytes + ' B';
            if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
            return (bytes / 1024 / 1024).toFixed(1) + ' MB';
        }

        function addMessage(text, role) {
            const div = document.createElement('div');
            div.className = `message ${role}`;
            div.textContent = text;
            document.getElementById('messages').appendChild(div);
            div.scrollIntoView({ behavior: 'smooth' });
            return div;
        }

        async function sendQuestion() {
            const input = document.getElementById('questionInput');
            const question = input.value.trim();
            if (!question) return;

            const btn = document.getElementById('sendBtn');
            btn.disabled = true;
            input.value = '';
            addMessage(question, 'user');

            const botMsg = addMessage('', 'bot');

            try {
                const res = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ question, conversationId })
                });
                const data = await res.json();
                botMsg.textContent = data.answer;
                if (data.sources && data.sources.length > 0) {
                    const sources = document.createElement('div');
                    sources.className = 'sources';
                    sources.textContent = '引用: ' + data.sources.map(s => s.filename).join(', ');
                    botMsg.appendChild(sources);
                }
            } catch (e) {
                botMsg.textContent = '请求失败，请检查 API Key 配置和服务状态。';
            }

            btn.disabled = false;
            input.focus();
        }

        document.getElementById('sendBtn').addEventListener('click', sendQuestion);
        document.getElementById('questionInput').addEventListener('keydown', e => {
            if (e.key === 'Enter') sendQuestion();
        });

        document.getElementById('fileInput').addEventListener('change', async e => {
            const file = e.target.files[0];
            if (!file) return;
            const formData = new FormData();
            formData.append('file', file);
            addMessage(`正在上传: ${file.name}...`, 'bot');
            try {
                const res = await fetch('/api/documents/upload', { method: 'POST', body: formData });
                const data = await res.json();
                addMessage(data.message, 'bot');
                await loadDocuments();
                await loadHealth();
            } catch {
                addMessage('上传失败', 'bot');
            }
            e.target.value = '';
        });

        init();
    </script>
</body>
</html>
